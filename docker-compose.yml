services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: qgent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qgent}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?copy .env.example to .env and set POSTGRES_PASSWORD}"
      POSTGRES_DB: ${POSTGRES_DB:-qgent_db}
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qgent} -d ${POSTGRES_DB:-qgent_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
